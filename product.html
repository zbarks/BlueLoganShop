<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue's Shop</title>
<meta name="description" content="From Blue Logan's shop.">

<meta name="theme-color" content="#f3ecdf">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/permanent-marker-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/shop.css">
<script src="/assets/js/shop.js" defer></script>
</head>
<body data-page="product">
<a class="visually-hidden" href="#main">Skip to content</a>
<header class="site-header">

    <span class="footer-hand" data-shop-title>Blue's Shop</span>
