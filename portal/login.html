<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Log in | Blue Logan Portal</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/portal/portal.css">
<script src="/portal/portal.js" defer></script>
</head>
<body data-page="login">
<main class="wrap">
  <div class="login-box">
    <div class="p-brand" style="margin-bottom:6px">Blue Logan Portal</div>
    <p class="muted" style="margin-top:0">Log in to manage the shop.</p>
    <div id="login-note"></div>
    <form id="login-form">
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="pbtn go" id="login-btn" type="submit" style="width:100%">Log in</button>
    </form>
    <p class="hint" style="margin-top:18px">Forgotten the password? Ask Zach to reset it.</p>
    <p style="margin-bottom:0"><a href="/shop">Go to the shop</a></p>
  </div>
</main>
</body>
</html>
