<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop all | Blue's Shop</title>
<meta name="description" content="Everything in Blue Logan's shop.">

<meta name="theme-color" content="#f3ecdf">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/permanent-marker-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/shop.css">
<script src="/assets/js/shop.js" defer></script>
</head>
<body data-page="shop">
<a class="visually-hidden" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-row">
    <!-- TODO(Blue): his own lettering for the shop name (editable in the portal under Settings). -->
    <div class="wm-box"><a class="wordmark" href="/" data-shop-title data-fit="18">Blue's Shop</a></div>
    <nav class="main-nav" aria-label="Main">
      <a class="shop-all" href="/shop" aria-current="page">Shop all</a>
      <a href="/search">Search</a>
      <a href="/contact">Contact</a>
      <a href="https://bluelogan.co.uk" data-main-site="">Blue Logan</a>
    </nav>
  </div>
</header>
<main id="main">
<div class="wrap">
  <div class="page-head">
    <h1 class="page-title" id="list-title" data-fit="26">Shop all</h1>
    <p class="page-sub" id="list-sub"></p>
  </div>
  <div class="toolbar">
    <nav class="tabs" id="tabs" aria-label="Categories"></nav>
    <div class="tools">
      <label class="visually-hidden" for="q">Search the shop</label>
      <input class="search" id="q" type="search" placeholder="Search the shop" autocomplete="off">
      <label class="visually-hidden" for="sort">Sort</label>
      <select class="sort" id="sort">
        <option value="">Shop order</option>
        <option value="new">Newest</option>
        <option value="az">A to Z</option>
      </select>
    </div>
  </div>
  <div class="grid" id="grid" aria-live="polite"></div>
</div>
</main>
<footer class="site-footer">
  <div class="wrap footer-row">
    <span class="footer-hand" data-shop-title>Blue's Shop</span>
    <nav aria-label="Footer">
      <a href="/shop">Shop all</a>
      <a href="/search">Search</a>
      <a href="/contact">Contact</a>
      <a href="https://bluelogan.co.uk" data-main-site="">Blue Logan</a>
      <a href="https://barkerdigital.co.uk">Site by Barker Digital</a>
    </nav>
  </div>
</footer>
</body>
</html>
